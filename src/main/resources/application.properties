spring.application.name=family-league

# ── Database ───────────────────────────────────────────────────────────────
spring.datasource.url=jdbc:postgresql://localhost:5432/family_league
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.datasource.driver-class-name=org.postgresql.Driver

# ── JPA / Hibernate ─────────────────────────────────────────────────────────
# Flyway manages the schema; Hibernate must NOT auto-create/update
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# ── Flyway ──────────────────────────────────────────────────────────────────
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0

# ── JWT ─────────────────────────────────────────────────────────────────────
app.jwt.secret=${JWT_SECRET:zCL7IgM/RAnPzkgRTEtcL6SnT9UeKhlkBLovjCEqm9rm1Y/SwjfAElgBnqMPjlCON/xKsycKqO4JHEFCESE9gA==}
app.jwt.expiration-ms=86400000

# ── Mail ─────────────────────────────────────────────────────────────────────
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:projects@divami.com}
spring.mail.password=${MAIL_PASSWORD:hsqqspvzaplozvwv}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
app.mail.from=${MAIL_FROM:projects@divami.com}

# ── Async ─────────────────────────────────────────────────────────────────
app.async.core-pool-size=5
app.async.max-pool-size=10
app.async.queue-capacity=100

# ── Prediction windows (hours) ────────────────────────────────────────────
app.prediction.league-lock-hours-before-first-match=4
app.prediction.match-lock-hours-before-start=1

# ── Admin email for alerts ─────────────────────────────────────────────────
app.admin.alert-email=${ADMIN_ALERT_EMAIL:admin@familyleague.local}

# ── Logging ─────────────────────────────────────────────────────────────────
logging.config=classpath:logback-spring.xml
logging.level.org.flywaydb=INFO

# ── OpenAPI / Swagger ────────────────────────────────────────────────────────
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method

# ── Actuator ─────────────────────────────────────────────────────────────────
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=when-authorized